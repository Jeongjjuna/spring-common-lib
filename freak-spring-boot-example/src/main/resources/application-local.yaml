spring:
  application:
    name: spring-example-api
  jackson:
    mapper:
      sort-properties-alphabetically: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver


freak:
  common:
    web:
      enabled: true
      swagger:
        result-code-scan:
          enabled: true
        description: |
          ### 커스텀한 설명을 적을 수 있습니다.
          스스텀 설명 ...
          
          | 코드 | 메세지 |
          | ----| -----|
          | 50100 | Not Fount |
    http:
      clients:
        auth-api:
          base-url: http://localhost:8080
          connect-timeout: 3s
          read-timeout: 1s
          pool-size: 5
          connection-ttl: 50
          connection-request-timeout: 5s
        reward-api:
          base-url: http://localhost:8080
          connect-timeout: 3s
          read-timeout: 10s
          pool-size: 5
          connection-ttl: 50
          connection-request-timeout: 5s

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true